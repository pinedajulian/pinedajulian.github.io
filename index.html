<script>
  function updateJapaneseClock() {
    const now = new Date();
    const options = {
      timeZone: "America/Los_Angeles"
    };

    const date = new Intl.DateTimeFormat("ja-JP", {
      ...options,
      year: "numeric",
      month: "numeric",
      day: "numeric"
    }).format(now);

    const time = new Intl.DateTimeFormat("ja-JP", {
      ...options,
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }).format(now);

    document.getElementById("clock").textContent =
      `${date.replace(/\//g, "年").replace(/年(\d+)月/, "年$1月").replace(/月(\d+)$/, "月$1日")} ${time}`;
  }

  updateJapaneseClock();
  setInterval(updateJapaneseClock, 1000);
</script>
