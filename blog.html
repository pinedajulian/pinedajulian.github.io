  <script>
    function updateJapaneseClock() {
      const now = new Date();
      const options = {
        timeZone: "America/Los_Angeles"
      };

      const parts = new Intl.DateTimeFormat("ja-JP-u-ca-gregory", {
        ...options,
        year: "numeric",
        month: "numeric",
        day: "numeric"
      }).formatToParts(now);

      const part = (type) =>
        parts.find((item) => item.type === type)?.value ?? "";

      const date =
        `${part("year")}年${part("month")}月${part("day")}日`;

      const time = new Intl.DateTimeFormat("ja-JP", {
        ...options,
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).format(now);

      document.getElementById("clock").textContent =
        `${date} ${time}`;
    }

    updateJapaneseClock();
    setInterval(updateJapaneseClock, 30000);
  </script>
